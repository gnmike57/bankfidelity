[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
unsound = "denn"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSF-1-Clause",
]
deny = []
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"

[bans]
multiple-versions = "warn"
wildcard-bans = ["*"]
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
